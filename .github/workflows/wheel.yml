name: PyPi wheels

on: [push, pull_request]


jobs:
  buildLinxaarch:
    if: startsWith(github.ref, 'refs/tags/20')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        architecture: ['x64']
        include:
          # https://cibuildwheel.readthedocs.io/en/stable/options/#build-skip
          - os: ubuntu-24.04
            linux_archs: "aarch64"
    name: ${{ matrix.os }} ${{ matrix.architecture }} ${{ matrix.linux_archs }}
    env:
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
      CIBW_BEFORE_ALL: "pip install numpy cython"
      CIBW_SKIP: "pp* *38* *-musllinux_aarch64"
      CIBW_ARCHS_LINUX: ${{ matrix.linux_archs }}
      CIBW_TEST_SKIP: "*"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: delvewheel install
        if: runner.os == 'Windows'
        run: |
          python -m pip install delvewheel cython

      - name: Build wheels
        uses: joerick/cibuildwheel@v3.4.1

      - name: list output
        run: ls ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v6
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}-${{ matrix.architecture}}-${{ matrix.linux_archs}}

  buildLinx686:
    if: startsWith(github.ref, 'refs/tags/20') 
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        architecture: ['x64']
        include:
          # https://cibuildwheel.readthedocs.io/en/stable/options/#build-skip
          - os: ubuntu-24.04
            linux_archs: "i686"
            skip: "pp*"

    name: ${{ matrix.os }} ${{ matrix.architecture }} ${{ matrix.linux_archs }}
    env:
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
      CIBW_BEFORE_ALL: "pip install cython"
      CIBW_SKIP: ${{ matrix.skip }}
      CIBW_ARCHS_LINUX: ${{ matrix.linux_archs }}
      CIBW_TEST_SKIP: "*"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: delvewheel install
        if: runner.os == 'Windows'
        run: |
          python -m pip install delvewheel cython

      - name: Build wheels
        uses: joerick/cibuildwheel@v3.4.1

      - name: list output
        run: ls ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v6
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}-${{ matrix.architecture}}-${{ matrix.linux_archs }}

  buildLinx86x64:
    if: startsWith(github.ref, 'refs/tags/20') 
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        architecture: ['x64']
        include:
          # https://cibuildwheel.readthedocs.io/en/stable/options/#build-skip
          - os: ubuntu-24.04
            linux_archs: "x86_64"
            skip: "pp*"

    name: ${{ matrix.os }} ${{ matrix.architecture}}
    env:
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
      CIBW_BEFORE_ALL: "pip install cython"
      CIBW_SKIP: ${{ matrix.skip }}
      CIBW_ARCHS_LINUX: ${{ matrix.linux_archs }}
      CIBW_TEST_SKIP: "*"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: delvewheel install
        if: runner.os == 'Windows'
        run: |
          python -m pip install delvewheel cython

      - name: Build wheels
        uses: joerick/cibuildwheel@v3.4.1

      - name: list output
        run: ls ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v6
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}-${{ matrix.architecture}}-${{ matrix.linux_archs}}

  buildWin:
    # fork verification only: run on this branch instead of release tags
    if: startsWith(github.ref, 'refs/tags/20') || github.ref == 'refs/heads/verify/windows-arm64-wheels'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        architecture: ['x64']
        include:
          # https://cibuildwheel.readthedocs.io/en/stable/options/#build-skip
          - os: windows-latest
            skip: ""
          - os: windows-11-arm
            architecture: 'arm64'
            # cp310: NumPy has no win_arm64 wheel for Python 3.10 and its
            # source build fails in the isolated build environment
            skip: "cp310-*"

    name: ${{ matrix.os }} ${{ matrix.architecture}}
    env:
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
      CIBW_BEFORE_ALL: "pip install cython"
      CIBW_SKIP: ${{ matrix.skip }}
      CIBW_ARCHS_LINUX: ${{ matrix.linux_archs }}
      CIBW_TEST_SKIP: "*"
      CIBW_BEFORE_TEST: "git status"

    steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Fetch upstream release tags (fork verification only; setuptools_scm needs them)
          shell: bash
          run: git fetch --no-recurse-submodules https://github.com/dask/fastparquet.git '+refs/tags/*:refs/tags/*'

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Set up QEMU
          if: runner.os == 'Linux'
          uses: docker/setup-qemu-action@v3
          with:
            platforms: all

        - name: Add msbuild to PATH
          if: runner.os == 'Windows'
          uses: microsoft/setup-msbuild@v3

        - name: delvewheel install
          if: runner.os == 'Windows'
          run: |
            python -m pip install delvewheel cython

        - name: Build wheels
          uses: joerick/cibuildwheel@v3.4.1

        - name: list output
          run: ls ./wheelhouse/*.whl

        - uses: actions/upload-artifact@v6
          with:
            path: ./wheelhouse/*.whl
            name: wheels-${{ matrix.os }}-${{ matrix.architecture}}

  buildMAC:
    if: startsWith(github.ref, 'refs/tags/20') 
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        architecture: ["universal2",  "arm64"]

    name: ${{ matrix.os }} ${{ matrix.architecture}}
    env:
      CIBW_BEFORE_ALL: "pip install numpy cython"
      CIBW_SKIP: "*38* *39*"
      CIBW_ARCHS_MACOS: ${{ matrix.architecture }}
      CIBW_TEST_SKIP: "*"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: joerick/cibuildwheel@v3.4.1

      - name: list output
        run: ls ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v6
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}-${{ matrix.architecture}}

  # fork verification only: run the upstream test suite against every
  # Windows ARM64 wheel built by buildWin, one native interpreter per version
  verifyWinArm64:
    if: github.ref == 'refs/heads/verify/windows-arm64-wheels'
    needs: buildWin
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    name: verify windows-11-arm py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-windows-11-arm-arm64
          path: wheelhouse
      - name: Install wheel and test deps (same as test_wheel.yaml)
        shell: bash -l {0}
        run: |
          set -ex
          python -c "import sys, sysconfig, platform; print(sys.version, sysconfig.get_platform(), platform.machine())"
          python -m pip install -U pip
          python -m pip install "pandas<3"
          python -m pip install --find-links wheelhouse --only-binary fastparquet fastparquet
          python -m pip install pytest
          python -m pip list
      - name: Run tests
        shell: bash -l {0}
        run: |
          mv ./fastparquet ./fastparquet-src
          python -c "import fastparquet, sys; print(fastparquet.__version__, fastparquet.__file__)"
          pytest --verbose --junitxml=junit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-win-arm64-${{ matrix.python-version }}
          path: junit-*.xml
